name: Import AI Quant Lab

on:
  push:
    paths:
      - '.bootstrap/.complete'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble and verify archive
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .bootstrap/part01.b64 \
            .bootstrap/part02.b64 \
            .bootstrap/part03.b64 \
            .bootstrap/part04.b64 \
            .bootstrap/part05.b64 \
            .bootstrap/part06.b64 \
            .bootstrap/part07.b64 \
            .bootstrap/part08a.b64 \
            .bootstrap/part08b.b64 \
            .bootstrap/part09a.b64 \
            .bootstrap/part09b.b64 \
            .bootstrap/part10a.b64 \
            .bootstrap/part10b.b64 \
            .bootstrap/part11.b64 \
            | base64 -d > /tmp/ai-quant-lab.tar.xz
          echo "dbcae1484bbddaeae02e849ec17668ce29a3e163dd429da45c0018911349b1be  /tmp/ai-quant-lab.tar.xz" | sha256sum -c --strict
          mkdir -p /tmp/aiql
          tar -xJf /tmp/ai-quant-lab.tar.xz -C /tmp/aiql
          test "$(find /tmp/aiql/AI_QUANT_LAB -type f | wc -l)" -eq 142
          test -f /tmp/aiql/AI_QUANT_LAB/pyproject.toml
          test -f /tmp/aiql/AI_QUANT_LAB/README.md

      - name: Replace repository with project
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/aiql/AI_QUANT_LAB/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import AI Quant Lab project"
          git push origin HEAD:main
