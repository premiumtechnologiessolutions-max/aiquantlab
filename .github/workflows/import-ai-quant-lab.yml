name: Import AI Quant Lab

on:
  push:
    paths:
      - ".bootstrap/part11b.b64"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble and verify archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part*.b64 | base64 -d > /tmp/ai-quant-lab.tar.xz
          echo "dbcae1484bbddaeae02e849ec17668ce29a3e163dd429da45c0018911349b1be  /tmp/ai-quant-lab.tar.xz" | sha256sum -c -
          mkdir -p /tmp/aiql
          tar -xJf /tmp/ai-quant-lab.tar.xz -C /tmp/aiql
          test "$(find /tmp/aiql/AI_QUANT_LAB -type f | wc -l)" -eq 142

      - name: Replace repository with project
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/aiql/AI_QUANT_LAB/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import AI Quant Lab project"
          git push origin HEAD:main
