name: NoRiskFX - private Nova read-only exporter
on:
  pull_request:
    paths:
      - 'src/ai_quant_lab/integrations/noriskfx_export.py'
      - 'src/ai_quant_lab/integrations/__init__.py'
      - 'scripts/export_noriskfx_nova.py'
      - 'tests/test_noriskfx_nova_export.py'
      - '.github/workflows/noriskfx-nova-export.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exporter-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install research dependencies
        run: python -m pip install -e '.[dev]'
      - name: Compile export code
        run: python -m compileall -q src/ai_quant_lab/integrations scripts/export_noriskfx_nova.py
      - name: Read-only export regression tests
        run: python -m pytest -q tests/test_noriskfx_nova_export.py
  full-aql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install research dependencies
        run: python -m pip install -e '.[dev]'
      - name: AQL complete regression
        run: python -m pytest -q
