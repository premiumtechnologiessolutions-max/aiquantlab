name: Guarded XAUUSD research checks

on:
  push:
    branches: [research/xauusd-discovery]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xauusd-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install research package and test tools
        run: python -m pip install -e ".[dev]"
      - name: Run research regression tests
        run: python -m pytest -q tests/test_xauusd_support.py tests/test_gold_m15_bridge.py tests/test_research_mvp.py tests/test_simulation.py
