[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-quant-lab"
version = "0.4.0"
description = "Autonomous multi-agent quantitative research and backtesting laboratory."
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "duckdb",
    "pydantic",
    "pydantic-settings",
    "PyYAML",
    "python-dotenv",
    "httpx",
    "tenacity",
    "rich",
    "typer",
    "structlog",
    "MetaTrader5; platform_system == 'Windows'"
]

[project.scripts]
ai-quant-lab = "ai_quant_lab.cli:app"
ai-quant-lab-runtime = "ai_quant_lab.runtime.lab:run_runtime"
ai-quant-lab-voice = "ai_quant_lab.web.server:serve_voice_dashboard"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.14"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ai_quant_lab.web" = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
